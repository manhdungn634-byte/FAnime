  s[sI].eps.map((e,i)=>`<div class="er ${L&&L.s==sI&&L.e==i?'cur':''}" data-ep="${i}"><div class="th" style="background-image:url('${esc(CI.cov)}')">${I('play',16)}<s>${esc(CI.time||'')}</s></div><div class="x"><b>${esc(e.name.match(/^\d+$/)?(+e.name)+'. Tập '+e.name:e.name)}</b><p><span>${esc(CI.lang)}</span><span style="display:flex;gap:10px">${I('dl',20)}${I('more',20)}</span></p></div></div>`).join('')}
async function similar(){$('#db').innerHTML='<div class="sk"></div>';try{const a=await list(2);$('#db').innerHTML=`<div class="grid" style="margin-top:14px">${a.map(pc).join('')}</div>`}catch(e){$('#db').innerHTML=err()}}

/* ---------- PLAYER ---------- */
let hls,hide,V;
function play(si,ei){
  sI=si;eI=ei;const e=D.servers[si].eps[ei],el=$('#pl'),nx=D.servers[si].eps[ei+1];
  const L=last();L[key(CI)]={s:si,e:ei,n:epn(e.name)};S('last',L);
  el.classList.add('on');el.scrollTop=0;
  const ok=e.m3u8&&(window.Hls&&Hls.isSupported()||document.createElement('video').canPlayType('application/vnd.apple.mpegurl'));
  el.innerHTML=`<div class="vw" id="vw">${ok?'<video id="v" playsinline autoplay></video>':`<iframe src="${esc(e.embed)}" allowfullscreen allow="autoplay;fullscreen"></iframe>`}
  <div class="ct ${ok?'':'h'}" id="ct"><div class="r"><button data-pc aria-label="Thu nhỏ">${I('cd',26)}</button><button data-fs aria-label="Toàn màn hình">${I('fs',22)}</button></div>
  <div class="m"><button data-sk="-10">${I('rw',34)}</button><button data-pp id="pp">${I('pause',36)}</button><button data-sk="10">${I('fw',34)}</button></div>
  <div class="rg"><span id="t0">00:00</span><input id="rg" type="range" min="0" max="1000" value="0"><span id="t1">--:--</span></div></div>
  ${ok?'':`<button data-pc style="position:absolute;top:8px;left:8px;background:#000a;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center">${I('cd',22)}</button>`}</div>
  <div class="pi"><div class="sn">${esc(CI.name)}</div><h1>${esc(epn(e.name))} – ${esc(CI.name)}</h1><div class="mt"><span class="bd">${esc(CI.year||'HD')}</span><span>•</span><span>${esc(CI.lang)}</span></div>
  <div class="lk"><span>${I('up',22)}${D.views?Math.round(D.views/1000)+'K':'Thích'}</span><span>${I('dn',22)}</span><span class="sp">${I('dl',22)}</span>${I('more',22)}</div>
  <p class="dd o" style="-webkit-line-clamp:2;display:-webkit-box">${esc(D.desc)}</p>
  <div class="alt">${e.embed?`<a href="${esc(e.embed)}" target="_blank" rel="noopener">Mở trình phát ngoài</a>`:''}<button data-alt>${CI.src=='nc'?'Thử nguồn KKPhim':'Thử nguồn NguonC'}</button></div>
  ${nx?`<div class="nx">Tập tiếp theo</div><div class="er" style="padding:0" data-ep="${ei+1}"><div class="th" style="background-image:url('${esc(CI.cov)}')">${I('play',16)}<s>${esc(CI.time||'')}</s></div><div class="x"><b>${esc(nx.name.match(/^\d+$/)?(+nx.name)+'. Tập '+nx.name:nx.name)}</b><p><span>${esc(CI.lang)}</span>${I('dl',20)}</p></div></div>`:''}
  <button class="al" data-pc>Tất cả các tập</button></div>`;
  if(hls){hls.destroy();hls=null}V=$('#v');if(!V)return;
  if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(e.m3u8);hls.attachMedia(V);hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal){hls.destroy();hls=null;$('#vw').innerHTML=`<iframe src="${esc(e.embed)}" allowfullscreen allow="autoplay;fullscreen"></iframe>`}})}else V.src=e.m3u8;
  const f=t=>{t=Math.floor(t||0);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
  V.ontimeupdate=()=>{$('#t0').textContent=f(V.currentTime);if(V.duration){$('#t1').textContent=f(V.duration);$('#rg').value=V.currentTime/V.duration*1000}};
  V.onplay=()=>{$('#pp').innerHTML=I('pause',36);poke()};V.onpause=()=>{$('#pp').innerHTML=I('play',36)};
  V.onwaiting=()=>{$('#pp').innerHTML='<div class="ring"></div>'};V.onplaying=()=>{$('#pp').innerHTML=I('pause',36)};
  V.onended=()=>{if(nx)play(si,ei+1)};
  $('#rg').oninput=ev=>{if(V.duration)V.currentTime=ev.target.value/1000*V.duration};
  $('#vw').onclick=ev=>{if(ev.target.closest('button,input'))return;$('#ct').classList.toggle('h');poke()};poke()}
function poke(){clearTimeout(hide);hide=setTimeout(()=>{const c=$('#ct');if(c&&V&&!V.paused)c.classList.add('h')},3000)}
async function altSrc(){
  const to=CI.src=='nc'?'kk':'nc',keep=src,ei=eI,nm=CI.name;let it;
  try{src=to;const r=await find(nm);it=r.find(x=>x.name.trim().toLowerCase()==nm.trim().toLowerCase())||r[0]}catch(e){}finally{src=keep}
  if(!it){alert('Không tìm thấy phim này ở nguồn '+(to=='kk'?'KKPhim':'NguonC'));return}
  closePl();await openDet(it);
  if(D&&D.servers.length&&D.servers[0].eps.length)play(0,Math.min(ei,D.servers[0].eps.length-1))}
function closePl(){if(hls){hls.destroy();hls=null}$('#pl').classList.remove('on');setTimeout(()=>{if(!$('#pl').classList.contains('on'))$('#pl').innerHTML=''},400);if($('#det').classList.contains('on'))eps()}

/* ---------- EVENTS ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-k],[data-t],[data-go],[data-sv],[data-sr],[data-sc],[data-sf],[data-lt],[data-more],[data-yr],[data-src],[data-ed],[data-au],[data-at],[data-fv],[data-shc],[data-auth],[data-am],[data-pa],[data-ps],[data-exp],[data-lo],[data-sync],[data-msr],[data-inst],[data-cp],[data-cpc],[data-cpo],[data-clm],[data-alt],[data-mg],[data-mo],[data-ml],[data-mmore],[data-cs],[data-ch],[data-rf],[data-rcl],[data-rp],[data-rn],[data-clr],[data-dc],[data-ep],[data-pc],[data-pp],[data-sk],[data-fs],[data-dtab],[data-md],[data-share]');if(!t)return;
  const d=t.dataset;
  if(e.target.closest('[data-menu]')&&d.k)return;
  if(d.k)return openDet(M[d.k]);
  if(d.t){tab=d.t;$('#cp').classList.remove('on');$('#rd').classList.remove('on');$('#sr').classList.remove('on');$('#det').classList.remove('on');return render()}
  if(d.go){const it=M[d.go];const l=last()[d.go];openDet(it).then(()=>{if(D&&D.servers.length&&D.servers[0].eps.length)play(l?l.s:0,l?l.e:0)});return}
  if(d.sv!==undefined){const it=M[d.sv],l=wl(),i=l.findIndex(x=>key(x)==d.sv);i<0?l.unshift(it):l.splice(i,1);S('wl',l);document.querySelectorAll(`[data-sv="${d.sv}"]`).forEach(b=>{b.classList.toggle('on',i<0);if(b.id=='sv2')b.innerHTML=I(i<0?'bm':'plus',22)+'Danh sách'});if(tab=='lists')lists();return}
  if(d.sr!==undefined)return openSearch();
  if(d.sc!==undefined)return $('#sr').classList.remove('on');
  if(d.sf){sf=d.sf;return rs()}
  if(d.lt){lt=d.lt;return lists()}
  if(d.more!==undefined){const [s,l]=d.more.split('|');pg++;t.textContent='Đang tải…';return more(s,l)}
  if(d.ed!==undefined)return openEdit();
  if(d.au)return openAuth(d.au);
  if(d.at){at=d.at;return acc()}
  if(d.shc!==undefined)return $('#sh').classList.remove('on');
  if(d.am){am=d.am;return drawAuth()}
  if(d.auth!==undefined)return doAuth();
  if(d.pa){tmpAv=d.pa;$('#pv').innerHTML=avh({av:tmpAv},96);return}
  if(d.ps!==undefined)return saveProf();
  if(d.exp!==undefined)return expData();
  if(d.lo!==undefined){W0('cur',null);SESS=null;try{localStorage.removeItem('sess')}catch(e){}return render()}
  if(d.sync!==undefined){t.textContent='Đang đồng bộ…';pull().then(()=>push()).then(()=>{alert(SYNC.err?'Lỗi: '+SYNC.err:'Đã sao lưu lên đám mây');render()});return}
  if(d.fv){const it=M[d.fv],l=G('fav')||[],i=l.findIndex(x=>key(x)==d.fv);i<0?l.unshift(it):l.splice(i,1);S('fav',l);t.innerHTML=I(i<0?'heartf':'heart',22)+'Yêu thích';return}
  if(d.clm!==undefined){S('mhist',[]);return acc()}
  if(d.cpo!==undefined)return openCp();
  if(d.cpc!==undefined)return $('#cp').classList.remove('on');
  if(d.cp!==undefined){$('#cp').classList.remove('on');return readCh(+d.cp)}
  if(d.inst!==undefined)return inst();
  if(d.msr!==undefined){scrollTo({top:0});const q=$('#mq');if(q)q.focus();return}
  if(d.alt!==undefined)return altSrc();
  if(d.mg)return openManga(d.mg);
  if(d.mo){mo=d.mo;mq='';return mangaView()}
  if(d.ml){ml=d.ml;return mangaView()}
  if(d.mmore!==undefined){mp++;t.textContent='Đang tải…';return mmore()}
  if(d.cs!==undefined){cdir=cdir=='desc'?'asc':'desc';return drawCh()}
  if(d.ch!==undefined)return readCh(+d.ch);
  if(d.rf!==undefined)return readCh(CH.length-1);
  if(d.rcl!==undefined){$('#rd').classList.remove('on');if(curM&&$('#chl')&&CH.length)drawCh();return}
  if(d.rp!==undefined)return readCh(CHi+1);
  if(d.rn!==undefined)return readCh(CHi-1);
  if(d.yr!==undefined){yr=d.yr;return simView()}
  if(d.src){src=d.src;S('src',src);return tab=='acc'?acc():render()}
  if(d.clr!==undefined){S('hist',[]);S('last',{});return acc()}
  if(d.dc!==undefined)return $('#det').classList.remove('on');
  if(d.ep!==undefined)return play(sI,+d.ep);
  if(d.pc!==undefined)return closePl();
  if(d.pp!==undefined){if(V)V.paused?V.play():V.pause();return poke()}
  if(d.sk!==undefined){if(V)V.currentTime+=+d.sk;return poke()}
  if(d.fs!==undefined){const w=$('#vw');(w.requestFullscreen||w.webkitRequestFullscreen||(()=>V&&V.webkitEnterFullscreen&&V.webkitEnterFullscreen())).call(w);return}
  if(d.dtab){document.querySelectorAll('[data-dtab]').forEach(b=>b.classList.toggle('on',b==t));return d.dtab=='e'?eps():similar()}
  if(d.md!==undefined){const p=$('#dd');p.classList.toggle('o');t.textContent=p.classList.contains('o')?'Thu gọn':'Chi tiết hơn';return}
  if(d.share!==undefined){if(navigator.share)navigator.share({title:CI.name,url:location.href}).catch(()=>{});return}
});
document.addEventListener('input',e=>{if(e.target.id=='mq'){clearTimeout(stm);const v=e.target.value.trim();stm=setTimeout(()=>{mq=v;mp=0;$('#g').innerHTML='';$('#mm').innerHTML='<div class="sk"></div>';mmore()},400);return}
  if(e.target.id=='q'){clearTimeout(stm);const v=e.target.value.trim();stm=setTimeout(()=>{sq=v;sbody()},350)}});
document.addEventListener('change',e=>{if(e.target.id=='svr'){sI=+e.target.value;eps()}});
document.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
  if(e.target.id=='imp')f.text().then(impData);
  if(e.target.id=='fi'){const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,128,128);tmpAv=c.toDataURL('image/jpeg',.8);$('#pv').innerHTML=avh({av:tmpAv},96);URL.revokeObjectURL(u)};im.src=u}});
document.addEventListener('click',e=>{if(!e.target.closest('#rp'))return;const b=$('#rd .rbar');if(!b)return;clearTimeout(rt);b.classList.toggle('h');if(!b.classList.contains('h'))rt=setTimeout(()=>b.classList.add('h'),5000)});
let DP=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e});
function inst(){
  if(navigator.standalone||matchMedia('(display-mode: standalone)').matches)return alert('Ứng dụng đã được thêm vào màn hình chính rồi.');
  if(DP){DP.prompt();DP=null;return}
  alert('iPhone/iPad (Safari): bấm nút Chia sẻ ở thanh dưới, kéo xuống chọn "Thêm vào MH chính", rồi bấm Thêm.\n\nAndroid (Chrome): bấm menu ⋮ rồi chọn "Thêm vào màn hình chính" hoặc "Cài đặt ứng dụng".')}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
addEventListener('scroll',()=>{if(tab=='home')$('#top').classList.toggle('s',scrollY>300)},{passive:true});
render();
if(SESS&&cloud())pull().then(c=>c&&render());
document.addEventListener('visibilitychange',()=>{if(!SESS||!cloud())return;if(document.hidden)push();else pull().then(c=>c&&render())});
</script>
