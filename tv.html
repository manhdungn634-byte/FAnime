<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAnime TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
:root{--or:#ff640a;--mu:#9a9aa2}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;color:#ececef;font:400 28px/1.35 "DM Sans",system-ui,sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;background:#09090b}
#bar{position:absolute;z-index:5;left:0;right:0;top:0;height:104px;padding:0 80px;display:flex;align-items:center;gap:16px;background:linear-gradient(#000d,#0000)}
#bar.off{display:none}
.lg{width:48px;height:48px;border-radius:50%;border:8px solid var(--or);border-right-color:transparent;position:relative;margin-right:36px}
.lg::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--or)}
.mi{height:60px;padding:0 30px;border-radius:30px;display:flex;align-items:center;font-size:27px;font-weight:500;color:#cfcfd4;transition:transform .15s,background .15s}
.mi.act{color:#fff;box-shadow:inset 0 -4px 0 var(--or)}
.foc.mi{background:var(--or);color:#000;transform:scale(1.08);box-shadow:none}
#view{position:absolute;inset:0}
#hero{position:absolute;left:0;top:0;width:1920px;height:660px;overflow:hidden}
#hero .bd{position:absolute;inset:0;background:center/cover;transition:opacity .4s}
#hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#09090bf2 0,#09090b99 42%,#0000 75%),linear-gradient(#0000 55%,#09090b 100%),linear-gradient(#000a,#0000 22%)}
#hero .tx{position:absolute;z-index:2;left:80px;bottom:62px;width:1050px}
#hero h1{font-size:74px;line-height:1.05;font-weight:700;margin-bottom:14px;text-shadow:0 4px 24px #000}
.meta{display:flex;gap:16px;align-items:center;font-size:27px;color:#d6d6da;margin-bottom:14px;flex-wrap:wrap}
.bd2{border:2px solid #aaa;border-radius:6px;padding:0 10px;font-size:23px}
.ds{font-size:28px;color:#d0d0d5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#rows{position:absolute;left:0;top:676px;width:1920px;transition:transform .35s cubic-bezier(.3,.9,.3,1)}
.row{height:404px}
.row h3{font-size:34px;font-weight:700;padding:0 80px;height:52px}
.vp{overflow:hidden;padding:26px 0 40px;margin-top:-14px}
.track{display:flex;gap:30px;padding:0 80px;width:max-content;transition:transform .3s cubic-bezier(.3,.9,.3,1)}
.card{width:206px;flex:none}
.card .im{width:206px;height:309px;border-radius:14px;overflow:hidden;background:#1a1a1f;transition:transform .15s,box-shadow .15s}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card b{display:block;margin-top:14px;font-size:24px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d6d6da}
.card small{display:block;font-size:21px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.foc .im{transform:scale(1.1);box-shadow:0 0 0 6px var(--or),0 18px 50px #000a}
.card.foc b{color:#fff}
.ld{padding:60px 80px;color:var(--mu);font-size:28px}
/* detail */
#dv{position:absolute;inset:0}
#dv .bg{position:absolute;inset:-40px;background:center/cover;filter:blur(30px) brightness(.35)}
#dv .pos{position:absolute;left:100px;top:110px;width:400px;height:600px;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px #000c;background:#1a1a1f}
#dv .pos img{width:100%;height:100%;object-fit:cover}
#dv .inf{position:absolute;left:580px;top:96px;right:100px;bottom:70px;display:flex;flex-direction:column}
#dv h1{font-size:64px;line-height:1.08;font-weight:700;margin-bottom:12px}
#dv .ds{-webkit-line-clamp:4;margin-bottom:26px}
.btn{display:inline-flex;align-items:center;gap:14px;height:76px;padding:0 44px;border-radius:38px;background:#ffffff22;font-size:30px;font-weight:700;transition:transform .15s}
.btn.foc,.chip.foc,.ep.foc,.key.foc{background:var(--or);color:#000;transform:scale(1.07)}
.chips{display:flex;gap:14px;margin:26px 0 8px;flex-wrap:wrap}
.chip{height:58px;padding:0 28px;border-radius:29px;background:#ffffff1a;font-size:25px;display:flex;align-items:center;transition:transform .15s}
.chip.on{box-shadow:inset 0 -4px 0 var(--or)}
#epsw{flex:1;overflow:hidden;margin-top:18px;padding:12px 8px 0}
#eps{display:grid;grid-template-columns:repeat(8,1fr);gap:16px}
.ep{height:72px;border-radius:14px;background:#ffffff1a;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:500;transition:transform .15s;overflow:hidden;white-space:nowrap}
/* search */
#sv{position:absolute;inset:0;padding-top:120px}
#qd{margin:0 80px;height:92px;border-radius:20px;background:#ffffff14;display:flex;align-items:center;padding:0 36px;font-size:44px;font-weight:500}
#qd i{font-style:normal;color:var(--mu)}#qd u{display:inline-block;width:3px;height:48px;background:var(--or);margin-left:4px}
#kb{margin:22px 80px 0;display:flex;flex-direction:column;gap:12px}
.kr{display:flex;gap:10px}
.key{width:104px;height:72px;border-radius:14px;background:#ffffff1a;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:500;transition:transform .15s}
.key.w{width:170px;font-size:24px}
#sres{position:absolute;left:0;top:560px;width:1920px}
.mi.ic{width:60px;padding:0;justify-content:center}
.avc{border-radius:50%;display:flex;align-items:center;justify-content:center;line-height:1;flex:none}
#av2{position:absolute;left:80px;top:140px;right:80px}
.pf{display:flex;gap:44px;align-items:center}
.pf h1{font-size:58px;line-height:1.1}.pf p{font-size:26px;color:var(--mu)}
.bts{display:flex;gap:20px;margin-top:22px}
.st{min-height:36px;margin-top:14px;font-size:25px!important;color:#ffb27a!important}
#auv{position:absolute;left:80px;right:80px;top:116px}
#auv h2{font-size:46px;margin-bottom:14px}
.flds{display:flex;gap:20px;margin-bottom:18px}
.fld{flex:1;height:76px;border-radius:16px;background:#ffffff14;display:flex;align-items:center;padding:0 30px;font-size:32px;gap:16px;border:3px solid transparent}
.fld small{font-size:24px;color:var(--mu)}.fld.on{border-color:#ffffff55}
.fld.foc{border-color:var(--or)}
#kb2{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
/* player */
#pl{position:absolute;inset:0;background:#000}
#pl video,#pl iframe{width:100%;height:100%;border:0;background:#000}
#ov{position:absolute;inset:0;opacity:0;transition:opacity .3s;background:linear-gradient(#000b,#0000 28%,#0000 62%,#000d);pointer-events:none}
#ov.show{opacity:1}
#ov .t{position:absolute;left:80px;top:60px;right:80px;font-size:40px;font-weight:700}
#ov .t small{display:block;font-size:26px;font-weight:400;color:#cfcfd4}
#ov .b{position:absolute;left:80px;right:80px;bottom:70px}
.pb{height:10px;border-radius:5px;background:#ffffff33;overflow:hidden}.pb i{display:block;height:100%;width:0;background:var(--or)}
.tm{display:flex;justify-content:space-between;font-size:26px;margin-top:14px}
.hint{margin-top:18px;font-size:23px;color:var(--mu)}
#sk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:54px;font-weight:700;background:#000a;padding:14px 40px;border-radius:50px;opacity:0;transition:opacity .2s}
#sk.show{opacity:1}
#sp{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px;border:9px solid #ff640a44;border-top-color:var(--or);border-radius:50%;animation:r .8s linear infinite;display:none}
@keyframes r{to{transform:rotate(360deg)}}
#toast{position:absolute;z-index:20;left:50%;bottom:60px;transform:translateX(-50%);background:#000d;border:2px solid #ffffff33;padding:16px 40px;border-radius:40px;font-size:28px;opacity:0;transition:opacity .25s}
#toast.show{opacity:1}
/* ---------- Liquid Glass (kiểu iOS 26) ---------- */
:root{--gl:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.05)),rgba(34,34,42,.46);--gb:rgba(255,255,255,.2);--gs:0 14px 40px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(255,255,255,.05);--bl:blur(28px) saturate(180%)}
#bar,.btn,.chip,.ep,.key,.fld,#qd,#dv .inf,#av2 .pf,#ov .t,#ov .b,#sk,#toast{background:var(--gl);border:1px solid var(--gb);box-shadow:var(--gs);-webkit-backdrop-filter:var(--bl);backdrop-filter:var(--bl)}
#bar{left:60px;right:60px;top:26px;height:92px;padding:0 22px;border-radius:46px}
.lg{margin-left:8px;margin-right:30px}
.mi{height:64px;border-radius:32px;color:#e2e2e6}
.mi.act{background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 14px rgba(0,0,0,.3);color:#fff}
.mi.foc,.mi.act.foc{background:linear-gradient(180deg,#ff9255,#ff640a);color:#1a0a00;transform:scale(1.08);box-shadow:0 10px 28px rgba(255,100,10,.55),inset 0 2px 0 rgba(255,255,255,.55)}
.card .im{border-radius:24px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 10px 30px rgba(0,0,0,.35)}
.card.foc .im{transform:scale(1.1);box-shadow:0 0 0 4px rgba(255,255,255,.9),0 0 0 9px var(--or),0 22px 60px rgba(0,0,0,.7),0 0 70px rgba(255,100,10,.45)}
.btn{border-radius:42px}.chip{border-radius:32px}.ep{border-radius:22px}.key{border-radius:20px}.fld{border-radius:24px;border-width:2px}#qd{border-radius:28px}
.bd2{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:10px}
.btn.foc,.chip.foc,.ep.foc,.key.foc{background:linear-gradient(180deg,#ff9255,#ff640a);color:#1a0a00;border-color:#ffb27a;box-shadow:0 10px 30px rgba(255,100,10,.5),inset 0 2px 0 rgba(255,255,255,.55);transform:scale(1.07)}
.fld.foc{border-color:var(--or);box-shadow:0 0 0 3px var(--or),var(--gs)}
.chip.on{box-shadow:var(--gs),inset 0 -4px 0 var(--or)}
#dv .pos{border-radius:30px;box-shadow:0 20px 60px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.2)}
#dv .inf{border-radius:40px;padding:34px 44px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03)),rgba(16,16,22,.45)}
#av2 .pf{border-radius:44px;padding:34px 44px}
#ov{background:linear-gradient(#0000 55%,#0008)}
#ov .t{left:80px;top:50px;right:auto;max-width:1400px;border-radius:40px;padding:16px 38px}
#ov .b{left:80px;right:80px;bottom:56px;border-radius:40px;padding:26px 40px 22px}
.pb{height:12px;background:rgba(255,255,255,.22)}
.pb i{background:linear-gradient(90deg,#ff9255,#ff640a);box-shadow:0 0 14px #ff640a}
#sk{border-radius:50px}#toast{border-radius:40px;border:1px solid var(--gb)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){#bar,.btn,.chip,.ep,.key,.fld,#qd,#dv .inf,#av2 .pf,#ov .t,#ov .b,#sk,#toast{background:rgba(34,34,42,.92)}}
.lite #bar,.lite .btn,.lite .chip,.lite .ep,.lite .key,.lite .fld,.lite #qd,.lite #dv .inf,.lite #av2 .pf,.lite #ov .t,.lite #ov .b,.lite #sk,.lite #toast{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(34,34,42,.92)}
/* ---------- thanh menu dạng viên thuốc xám (như mẫu) ---------- */
#bar,.lite #bar{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;left:60px;right:60px;top:28px;height:84px;padding:0;gap:22px}
.pill{display:flex;align-items:center;padding:6px;border-radius:48px;background:rgba(74,74,78,.62);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 30px rgba(0,0,0,.35)}
.lite .pill{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(60,60,64,.95)}
.mi{height:64px;padding:0 36px;border-radius:32px;font-size:24px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#f1f1f3;background:none;box-shadow:none}
.mi.act{background:#ff7a1f;color:#fff;box-shadow:none}
.mi.foc{background:rgba(255,255,255,.3);color:#fff;transform:scale(1.06);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.mi.act.foc{background:#ff7a1f;box-shadow:0 0 0 4px rgba(255,255,255,.9),0 10px 26px rgba(255,122,31,.5)}
.mi.ic{width:72px;height:72px;padding:0;border-radius:50%;background:rgba(74,74,78,.62);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 30px rgba(0,0,0,.35)}
.mi.ic.act{background:#ff7a1f}
.mi.ic.foc{background:rgba(255,255,255,.32)}
.mi.ic.act.foc{background:#ff7a1f}
.lite .mi.ic{-webkit-backdrop-filter:none;backdrop-filter:none}
/* ===== hiệu năng + chuyển động kiểu iOS 26 ===== */
:root{--sp:cubic-bezier(.34,1.5,.5,1);--ease:cubic-bezier(.22,1,.36,1)}
#splash{position:absolute;inset:0;z-index:50;background:#09090b;display:none;align-items:center;justify-content:center;overflow:hidden;transition:opacity .45s}
#splash.out{opacity:0;pointer-events:none}
#splash i{position:absolute;width:760px;height:760px;border-radius:50%;opacity:.85}
.b1{background:radial-gradient(closest-side,#ff640a,transparent);left:200px;top:100px;animation:bl1 3s ease-in-out infinite alternate}
.b2{background:radial-gradient(closest-side,#7c3aed,transparent);right:200px;top:300px;animation:bl2 3s ease-in-out infinite alternate}
.b3{background:radial-gradient(closest-side,#0d9488,transparent);left:700px;bottom:-200px;animation:bl1 3.4s ease-in-out infinite alternate}
@keyframes bl1{to{transform:translate3d(500px,160px,0) scale(1.2)}}@keyframes bl2{to{transform:translate3d(-560px,-120px,0) scale(.9)}}
#splash .sc{position:relative;padding:34px 90px;border-radius:70px;background:var(--gl);border:1px solid var(--gb);font-size:72px;font-weight:700;display:flex;gap:30px;align-items:center;-webkit-backdrop-filter:var(--bl);backdrop-filter:var(--bl);box-shadow:var(--gs)}
#splash .lg{margin:0}
/* chuyển màn hình */
#view.in{animation:vin .5s var(--ease)}
@keyframes vin{from{opacity:0;transform:translate3d(0,26px,0) scale(.985)}to{opacity:1;transform:none}}
#hero .tx.in{animation:txin .55s var(--ease)}
@keyframes txin{from{opacity:0;transform:translate3d(0,22px,0)}to{opacity:1;transform:none}}
#ov{transition:opacity .35s var(--ease)}
/* chỉ chuyển động bằng transform/opacity (mượt trên TV) */
#rows{transition:transform .5s var(--ease);will-change:transform}
.track{transition:transform .45s var(--ease);will-change:transform}
.row{contain:layout style}
.btn,.chip,.ep,.key,.mi.ic{transition:transform .38s var(--sp)}
.card .im{transition:transform .38s var(--sp)}
/* thẻ phim: viền, ánh sáng và vệt sáng chạy qua */
.card{position:relative;isolation:isolate}
.card .im{position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.card.foc .im{transform:scale(1.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);will-change:transform}
.card::before{content:"";position:absolute;left:0;top:0;width:206px;height:309px;border-radius:24px;box-shadow:0 0 0 4px rgba(255,255,255,.92),0 0 0 9px var(--or);opacity:0;transform:scale(1);transition:transform .38s var(--sp),opacity .18s;pointer-events:none;z-index:2}
.card.foc::before{opacity:1;transform:scale(1.1)}
.card::after{content:"";position:absolute;left:-30px;top:-20px;width:266px;height:369px;background:radial-gradient(closest-side,rgba(255,110,20,.4),transparent);opacity:0;transition:opacity .3s;z-index:-1;pointer-events:none}
.card.foc::after{opacity:1}
.card .im::after{content:"";position:absolute;top:0;bottom:0;left:-70%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-18deg);opacity:0;pointer-events:none}
.card.foc .im::after{animation:shine .9s var(--ease) 1}
@keyframes shine{0%{opacity:1;transform:translate3d(0,0,0) skewX(-18deg)}100%{opacity:0;transform:translate3d(520px,0,0) skewX(-18deg)}}
.card.pr .im{transform:scale(1.03)}.card.pr::before{transform:scale(1.03)}
.btn.pr,.chip.pr,.ep.pr,.key.pr{transform:scale(.95)}
/* kính giả (không blur) cho các nút nhỏ, chỉ giữ blur ở vài khối tĩnh */
.btn,.chip,.ep,.key,.fld,#qd,#ov .t,#ov .b,#sk,#toast{-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.05)}
.btn,.chip,.ep,.key,.fld,#qd{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.06)),rgba(40,40,48,.62)}
#ov .t,#ov .b{background:rgba(18,18,24,.74)}#sk,#toast{background:rgba(18,18,24,.82)}
.btn.foc,.chip.foc,.ep.foc,.key.foc{background:linear-gradient(180deg,#ff9255,#ff640a);box-shadow:inset 0 2px 0 rgba(255,255,255,.55);transform:scale(1.07)}
.fld.foc{box-shadow:0 0 0 3px var(--or)}
/* nền chi tiết: ảnh nhỏ phóng to thay cho filter blur */
#dv .bg{filter:none}#dv .bg::after{content:"";position:absolute;inset:0;background:rgba(6,6,10,.68)}
/* thanh menu: viên kính trượt */
.pill{position:relative}
.pill .mi,.pill .mi.act,.pill .mi.foc,.pill .mi.act.foc{position:relative;z-index:1;background:none;box-shadow:none;transform:none;color:#f1f1f3}
.pill .mi.act,.pill .mi.foc{color:#fff}
.ba,.bf{position:absolute;top:6px;height:64px;left:0;width:0;border-radius:32px;pointer-events:none;z-index:0;transition:left .5s var(--sp),width .5s var(--sp),opacity .25s}
.ba.i{transition:none}
.ba{background:#ff7a1f;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.bf{background:rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);opacity:0}
.bf.on{opacity:1}
/* chế độ nhẹ: tắt mọi blur */
.lite *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.lite .pill,.lite .mi.ic,.lite #dv .inf,.lite #av2 .pf,.lite #splash .sc{background:rgba(52,52,58,.95)}
.lite .card::after{display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="view"></div>
  <div id="bar"></div>
  <div id="toast"></div>
  <div id="splash"><i class="b1"></i><i class="b2"></i><i class="b3"></i><div class="sc"><div class="lg"></div>FAnime</div></div>
</div>
<script>
const KK='https://phimapi.com',CDN='https://phimimg.com';
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const J=async u=>{const r=await fetch(u);if(!r.ok)throw 0;return r.json()};
const strip=s=>String(s||'').replace(/<[^>]+>/g,'').trim();
const img=p=>!p?'':/^https?:/.test(p)?p:CDN+(p.includes('/')?'/':'/uploads/movies/')+p.replace(/^\//,'');
const th=(u,w)=>u?'https://wsrv.nl/?url='+encodeURIComponent(u)+'&w='+w+'&output=webp&q=80':'';
const norm=i=>({slug:i.slug,name:i.name,orig:i.origin_name||'',ep:i.episode_current||'',lang:i.lang||'',year:i.year||'',p:img(i.thumb_url||i.poster_url),b:img(i.poster_url||i.thumb_url)});
const lst=async q=>(await J(`${KK}/v1/api/danh-sach/${q}`)).data.items.map(norm);
const find=async k=>(await J(`${KK}/v1/api/tim-kiem?keyword=${encodeURIComponent(k)}&limit=24`)).data.items.map(norm);
const DC={};
async function det(it){
  if(DC[it.slug])return DC[it.slug];
  const r=await J(`${KK}/phim/${it.slug}`),m=r.movie;
  return DC[it.slug]={it,desc:strip(m.content),cats:(m.category||[]).map(c=>c.name),year:m.year,time:m.time,q:m.quality,lang:m.lang,b:img(m.poster_url||m.thumb_url),p:img(m.thumb_url||m.poster_url),

  const {mode,u,p}=au,m=t=>{$('#am').textContent=t},us=u.trim().toLowerCase();
  if(!/^[a-z0-9_.]{3,20}$/.test(us))return m('Tên đăng nhập 3–20 ký tự: chữ thường, số, dấu _ hoặc .');
  if(p.length<6)return m('Mật khẩu tối thiểu 6 ký tự');
  m('Đang xử lý…');
  try{await fbAuth(mode=='up'?'signUp':'signInWithPassword',us,p);
    if(mode=='up'){BL=emptyBlob(us);await putBlob(BL)}else{BL=(await getBlob())||emptyBlob(us)}
    LS.set('tvblob',BL);hist=[];F=null;show(()=>accView(),true)}
  catch(e){m(e===403?'Firestore chưa cho phép ghi (cần thêm Rules)':/EXISTS/.test(String(e))?'Tên đăng nhập đã tồn tại':/INVALID|NOT_FOUND|PASSWORD/.test(String(e))?'Sai tên đăng nhập hoặc mật khẩu':'Không kết nối được máy chủ')}}

/* ---------- trình phát ---------- */
let hls,pt,sv_t=0,sk=0,skT=0,PD,marked=false;
function fmt(t){t=Math.max(0,Math.floor(t||0));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')}
function playView(d,si,ei,t0){
  scr='player';bar(false);grid=[];F=null;PD={d,si,ei};marked=false;
  const e=d.sv[si].eps[ei],name=d.it.name;
  $('#view').innerHTML=`<div id="pl">${e.m3u8?'<video id="v" autoplay playsinline></video>':`<iframe src="${esc(e.embed)}" allowfullscreen allow="autoplay;fullscreen"></iframe>`}<div id="ov"><div class="t">${esc(name)}<small>${esc(e.name)} · ${esc(d.sv[si].name)}</small></div><div class="b"><div class="pb"><i id="pi"></i></div><div class="tm"><span id="t0">0:00</span><span id="t1">--:--</span></div><div class="hint">◀ ▶ tua · OK tạm dừng · ▲ tập trước · ▼ tập sau · Quay lại để thoát</div></div></div><div id="sk"></div><div id="sp"></div></div>`;
  if(!e.m3u8){toast('Tập này chỉ có trình phát nhúng, điều khiển hạn chế');return}
  const v=$('#v');if(hls){hls.destroy();hls=null}
  const fall=()=>{if(e.embed){$('#pl').innerHTML=`<iframe src="${esc(e.embed)}" allowfullscreen allow="autoplay;fullscreen"></iframe>`;toast('Chuyển sang trình phát nhúng')}else toast('Không phát được tập này')};
  if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(e.m3u8);hls.attachMedia(v);hls.on(Hls.Events.ERROR,(_,x)=>{if(x.fatal){hls.destroy();hls=null;fall()}})}
  else if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=e.m3u8;v.onerror=fall}
  else{v.src=e.m3u8;v.onerror=fall}
  v.onloadedmetadata=()=>{if(t0>10&&t0<v.duration-30)v.currentTime=t0};
  v.ontimeupdate=()=>{const dur=v.duration||0;$('#pi').style.width=(dur?v.currentTime/dur*100:0)+'%';$('#t0').textContent=fmt(v.currentTime);$('#t1').textContent=fmt(dur);
    if(Date.now()-sv_t>5000){sv_t=Date.now();saveProg(v.currentTime,dur)}
    if(!marked&&v.currentTime>30){marked=true;cloudMark(d,si,ei)}};
  v.onwaiting=()=>$('#sp').style.display='block';v.onplaying=()=>$('#sp').style.display='none';
  v.onpause=()=>pov(true);v.onplay=()=>pov();v.onended=()=>{saveProg(0,0);nextEp(1,true)};
  pov()}
function saveProg(t,dur){
  if(!PD)return;const {d,si,ei}=PD;let L=LS.get('tvl',[]).filter(x=>x.it.slug!=d.it.slug);
  if(t>5)L.unshift({it:d.it,si,ei,t:Math.floor(t),d:Math.floor(dur||0),at:Date.now()});LS.set('tvl',L.slice(0,20))}
function pov(keep){const o=$('#ov');if(!o)return;o.classList.add('show');clearTimeout(pt);if(!keep)pt=setTimeout(()=>{const v=$('#v');if(!v||!v.paused)o.classList.remove('show')},4000)}
function stopPlay(){const v=$('#v');if(v){const t=v.currentTime,du=v.duration;saveProg(du&&t>du-25?0:t,du);v.pause();v.removeAttribute('src');v.load()}if(hls){hls.destroy();hls=null}PD=null}
function nextEp(dir,auto){
  if(!PD)return;const {d,si,ei}=PD,n=ei+dir;
  if(n<0||n>=d.sv[si].eps.length){if(auto){stopPlay();back()}else toast(dir>0?'Đây là tập cuối':'Đây là tập đầu');return}
  stopPlay();cur=()=>playView(d,si,n,0);playView(d,si,n,0)}
function seek(dir){
  const v=$('#v');if(!v)return;const now=Date.now();sk=now-skT<700?Math.min(sk+1,6):0;skT=now;
  const step=[10,10,20,30,60,90,120][sk];v.currentTime=Math.max(0,Math.min(v.duration||1e9,v.currentTime+dir*step));
  const k=$('#sk');k.textContent=(dir>0?'▶▶ +':'◀◀ −')+step+' giây';k.classList.add('show');clearTimeout(k._t);k._t=setTimeout(()=>k.classList.remove('show'),700);pov()}

/* ---------- phím ---------- */
document.addEventListener('keydown',e=>{
  const k=e.keyCode;
  if(scr=='player'){
    if(BACK.includes(k)||k==8){e.preventDefault();stopPlay();back();return}
    const v=$('#v');if(!v)return;e.preventDefault();pov();
    if(k==37||k==412)seek(-1);else if(k==39||k==417)seek(1);
    else if(k==13||k==32||k==415||k==19||k==179){v.paused?v.play():v.pause()}
    else if(k==38)nextEp(-1);else if(k==40)nextEp(1);
    return}
  if(k>=37&&k<=40){e.preventDefault();const n=performance.now();if(e.repeat&&n-lastK<110)return;lastK=n;mv(k);return}
  if(k==13||k==32&&scr!='search'){e.preventDefault();if(F){F.classList.add('pr');const f=F;setTimeout(()=>f.classList.remove('pr'),170);F.click()}return}
  if(scr=='search'&&!e.ctrlKey&&!e.metaKey){
    if(k==8){e.preventDefault();typ(q.slice(0,-1));return}
    if(e.key&&e.key.length==1){e.preventDefault();typ(q+e.key.toLowerCase());return}}
  if(scr=='auth'&&!e.ctrlKey&&!e.metaKey){
    if(k==8){e.preventDefault();_del();return}
    if(e.key&&e.key.length==1&&k!=32&&k!=13){e.preventDefault();au[au.f]+=e.key;_af();return}}
  if(BACK.includes(k)||k==8){e.preventDefault();back()}});
document.addEventListener('mouseover',e=>{const t=e.target.closest('.f');if(!t||scr=='player')return;for(let i=0;i<grid.length;i++){const j=grid[i].indexOf(t);if(j>=0){if(grid[i][j]!==F)focusAt(i,j);break}}});
document.addEventListener('click',e=>{if(scr=='player'&&!e.target.closest('iframe')){const v=$('#v');if(v){v.paused?v.play():v.pause();pov()}}});
function setLite(l){$('#stage').classList.toggle('lite',l)}
function startApp(){show(()=>homeView())}
(function boot(){
  const qs=location.search,saved=localStorage.getItem('tvmode'),sp=$('#splash');
  const done=()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),450)};
  if(/[?&]lite/.test(qs)){setLite(true);sp.remove();return startApp()}
  if(/[?&]glass/.test(qs)){setLite(false);sp.remove();return startApp()}
  if(saved&&!/[?&]probe/.test(qs)){setLite(saved=='lite');sp.remove();return startApp()}
  sp.style.display='flex';let n=0,t0=0;
  const f=t=>{if(!t0)t0=t;n++;if(t-t0<1100)return requestAnimationFrame(f);
    const fps=n/((t-t0)/1000),lite=fps<42;try{localStorage.setItem('tvmode',lite?'lite':'glass')}catch(e){}
    setLite(lite);startApp();done()};
  requestAnimationFrame(f)})();
</script>
